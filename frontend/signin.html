          </div>
          <h2 class="text-lg md:text-xl font-medium tracking-wide mb-3 text-white/90" id="auth-title">

          </h2>
          <a href="/plans" class="text-white hover:text-[var(--accent-1)] transition-colors">PRICING</a>
        </div>

        </div>

          <div class="space-y-2" id="email-section">
            <label for="signin-email" class="text-xs font-semibold text-gray-400 ml-1 flex items-center gap-2">
              <i data-lucide="mail" class="w-3 h-3"></i> Email Address
            </label>
            <input
              id="signin-email"
              type="email"
              required
              autofocus
              class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl text-white font-mono focus:outline-none focus:border-cyan-500 focus:ring-4 focus:ring-cyan-500/10 transition-all text-lg"
              placeholder="you@example.com"
            />
          </div>

          <div class="pt-6">
            <button 
              type="submit" 
              id="submit-btn"
              class="w-full py-5 text-black bg-[var(--accent-1)] font-black rounded-2xl hover:bg-[var(--accent-1)]/80 transition-all transform hover:-translate-y-1 active:scale-95 disabled:opacity-50 disabled:transform-none flex justify-center items-center gap-3 text-xl group shadow-[0_0_25px_rgba(0,229,255,0.3)] hover:animate-spring-hover"
            >

              <span id="submit-text">Send Secure Link</span>
            </button>
            <p class="text-gray-500 font-bold uppercase tracking-[0.2em] text-xs text-center mt-6">
